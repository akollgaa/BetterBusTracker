<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Arrivals</title>
<style>
  :root {
    --bg: #0b0d0a;
    --panel: #12150f;
    --amber: #ffb100;
    --amber-dim: #7a5800;
    --green: #35d07f;
    --yellow: #e8c547;
    --red: #ff5a5a;
    --grid-line: #232a1e;
    --text-dim: #6b7362;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--amber);
    font-family: 'Courier New', 'DejaVu Sans Mono', monospace;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid var(--grid-line);
    padding: 16px 32px;
    flex: 0 0 auto;
  }
  .board-header h1 {
    font-size: 2.2rem;
    letter-spacing: 5px;
    margin: 0;
  }
  .board-header .clock {
    font-size: 1.6rem;
    color: var(--text-dim);
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .stop-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .stop-control label {
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  .stop-control input {
    background: var(--bg);
    border: 1px solid var(--grid-line);
    color: var(--amber);
    font-family: inherit;
    font-size: 1.1rem;
    width: 90px;
    padding: 4px 8px;
    letter-spacing: 1px;
  }
  .stop-control input:focus {
    outline: none;
    border-color: var(--amber);
  }
  .stop-control button {
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .stop-control button:hover {
    background: var(--amber);
    color: var(--bg);
  }
  #board {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow-y: auto;
  }
  .row {
    display: grid;
    grid-template-columns: 180px 1fr 260px 220px;
    align-items: center;
    padding: 28px 40px;
    border-bottom: 1px solid var(--grid-line);
    font-size: 2.9rem;
    flex: 1 0 20%;
  }
  .row:last-child { border-bottom: none; }
  .col-label {
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 2px;
  }
  .row.head {
    font-size: 1rem;
    letter-spacing: 3px;
    color: var(--text-dim);
    padding: 10px 40px;
    flex: 0 0 auto;
  }
  .route-id { font-weight: bold; font-size: 3.4rem; }
  .capacity-badge {
    display: inline-block;
    padding: 8px 22px;
    border: 2px solid currentColor;
    font-size: 1.9rem;
  }
  .capacity-empty { color: var(--green); }
  .capacity-half   { color: var(--yellow); }
  .capacity-full   { color: var(--red); }
  .capacity-unknown{ color: var(--text-dim); }
  .eta {
    font-variant-numeric: tabular-nums;
    font-size: 3.6rem;
    letter-spacing: 1px;
    text-align: right;
  }
  .eta.due { color: var(--red); animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #empty-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 0;
    display: none;
    font-size: 1.5rem;
  }
  @media (max-width: 700px) {
    .row { grid-template-columns: 90px 0 1fr 1fr; padding: 0 16px; font-size: 1.4rem; }
    .row.head { display: none; }
    .route-id { font-size: 1.6rem; }
    .capacity-badge { font-size: 1rem; padding: 4px 10px; }
    .eta { font-size: 1.8rem; }
    .board-header { padding: 12px 16px; }
    .board-header h1 { font-size: 1.4rem; letter-spacing: 2px; }
    .board-header .clock { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="board-header">
    <h1>BUS ARRIVALS</h1>
    <div class="header-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="stop-control">
        <label for="stopId">STOP</label>
        <input type="text" id="stopId" value="7097" inputmode="numeric" autocomplete="off">
        <button id="updateBtn">UPDATE</button>
      </div>
    </div>
  </div>

  <div id="board">
    <div class="row head">
      <div>ROUTE</div>
      <div>&nbsp;</div>
      <div>CAPACITY</div>
      <div>ARRIVING</div>
    </div>
    <div id="rows"></div>
  </div>
  <div id="empty-msg">No buses currently tracked</div>

<script>
  // ---- CONFIG: adjust to match your flask-sock route ----
  const WS_PATH = "/ws";

  const rowsEl = document.getElementById("rows");
  const emptyMsg = document.getElementById("empty-msg");

  // busId -> { route_id, capacity, totalSeconds }
  const buses = new Map();

  function busKey(b) {
    return b.id !== undefined ? String(b.id) : b.route_id + "-" + Math.random();
  }

  // Normalizes loosely — handles "EMPTY", "HALF_EMPTY", "FULL", "half", etc.
  function normalizeCapacity(cap) {
    const c = (cap || "").toLowerCase();
    if (c.includes("empty") && !c.includes("half")) return "empty";
    if (c.includes("half")) return "half";
    if (c.includes("full")) return "full";
    return "unknown";
  }

  function capacityClass(cap) {
    return "capacity-" + normalizeCapacity(cap);
  }

  function formatETA(totalSeconds) {
    if (totalSeconds <= 0) return "DUE";
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function render() {
    if (buses.size === 0) {
      rowsEl.innerHTML = "";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    const sorted = [...buses.entries()].sort((a, b) => a[1].totalSeconds - b[1].totalSeconds);

    rowsEl.innerHTML = sorted.map(([key, bus]) => `
      <div class="row" data-key="${key}">
        <div class="route-id">${bus.route_id}</div>
        <div></div>
        <div><span class="capacity-badge ${capacityClass(bus.capacity)}">${normalizeCapacity(bus.capacity).toUpperCase()}</span></div>
        <div class="eta ${bus.totalSeconds <= 0 ? "due" : ""}">${formatETA(bus.totalSeconds)}</div>
      </div>
    `).join("");
  }

  // Apply a fresh snapshot pushed from the server
  function applyServerUpdate(data) {
    const seen = new Set();
    data.forEach(b => {
      const key = busKey(b);
      seen.add(key);
      buses.set(key, {
        route_id: b.route_id,
        capacity: b.capacity,
        // accepts either minutes/seconds or minute/second key names
        totalSeconds: (b.minutes ?? b.minute ?? 0) * 60 + (b.seconds ?? b.second ?? 0)
      });
    });
    // remove buses no longer present in the update
    [...buses.keys()].forEach(k => { if (!seen.has(k)) buses.delete(k); });
    render();
  }

  // Local 1-second tick between server pushes
  setInterval(() => {
    buses.forEach(bus => {
      if (bus.totalSeconds > 0) bus.totalSeconds -= 1;
    });
    render();
  }, 1000);

  // Wall clock
  function tickClock() {
    document.getElementById("clock").textContent = new Date().toLocaleTimeString();
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- WebSocket (flask-sock is a raw WebSocket, not Socket.IO) ----
  const stopIdInput = document.getElementById("stopId");
  const updateBtn = document.getElementById("updateBtn");
  let socket = null;

  function sendStopId() {
    if (socket && socket.readyState === WebSocket.OPEN) {
      const stopId = stopIdInput.value.trim();
      if (stopId) socket.send(stopId);
    }
  }

  function connect() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${protocol}//${location.host}${WS_PATH}`);

    socket.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data); // expects: [{id, route_id, capacity, minutes, seconds}, ...]
        applyServerUpdate(data);
      } catch (e) {
        console.error("Bad message from server:", e);
      }
    };

    socket.onopen = () => {
      sendStopId(); // kick off the first push — your server loop is receive-gated
      // your loop only pushes after receiving something, so we send
      // the current stop id every 30s to drive the periodic refresh
      socket._pingInterval = setInterval(sendStopId, 30000);
    };

    socket.onclose = () => {
      clearInterval(socket._pingInterval);
      setTimeout(connect, 2000); // auto-reconnect
    };
    socket.onerror = () => socket.close();
  }
  connect();

  updateBtn.addEventListener("click", sendStopId);
  stopIdInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendStopId();
  });
</script>
</body>
</html>
